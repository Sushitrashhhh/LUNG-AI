name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          
        run: |
          git remote add hf https://abcdefghipri:${HF_TOKEN}@huggingface.co/spaces/abcdefghipri/LUNG-AI || true
          
          git push --force hf main
